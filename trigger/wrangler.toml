# Cloudflare Worker that fires the ingest workflow on schedule.
#
# It exists because GitHub Actions' `schedule:` trigger is best-effort and this
# repo is measurably throttled on it — 11 of ~36 ticks over 18 hours, all of them
# late, holes up to 167 minutes. The throttle is on GitHub's scheduled-event
# queue rather than on the repo's ability to run jobs, so the workflow_dispatch
# API bypasses it entirely. trigger/README.md has the full numbers and the
# measurements that ruled out slot contention.
#
# The GitHub cron in .github/workflows/ingest.yml is left running as a free
# backup and a continuing control measurement. This Worker is the primary
# trigger; that cron is the safety net if Cloudflare or the PAT fails.

name = "aqi-nowcast-trigger"
main = "src/index.js"
compatibility_date = "2026-08-10"

# No public URL. This Worker exports only `scheduled` — it has no `fetch`
# handler, so an HTTP endpoint would serve nothing. Cron Triggers are invoked by
# Cloudflare internally and need no route and no workers.dev subdomain.
#
# Without this, `wrangler deploy` assumes workers.dev publishing and hard-fails
# with "You can either deploy your worker to one or more routes ... or register a
# workers.dev subdomain".
#
# The account still needs a workers.dev subdomain to exist, though — setting
# this false is not a way to avoid creating one. Cloudflare's schedules API
# refuses with error 10063 ("You need a workers.dev subdomain in order to
# proceed") until the account has one, so a cron-only Worker uploads fine and
# then silently deploys no triggers at all: "No targets deployed", which reads
# like success if you are not looking for the schedule line. Open Workers &
# Pages in the dashboard once to create it, then re-deploy.
#
# The two are separate — the subdomain exists on the account, workers_dev = false
# keeps this Worker off it. A token-bearing trigger has no reason to have an
# internet-facing address, and no `fetch` handler to serve one anyway.
workers_dev = false

# Observability on, so a failed dispatch is visible in the Cloudflare dashboard
# rather than only in `wrangler tail` while someone happens to be watching.
[observability]
enabled = true

[triggers]
# :05 and :35 — twice an hour, which is what the GitHub cron was always asking
# for and never getting. CPCB publishes hourly and each bulletin sits on the feed
# for about an hour, so the second run is the margin: it catches the bulletin if
# the first one ran before CPCB published it.
#
# Not hourly, for two reasons. Neon bills roughly 5 minutes of compute per wake
# however short the run is, so cost scales with the number of runs and was worth
# checking first — measured in the Neon console on 2026-08-10, 0.78 of 100
# CU-hours since 2026-08-09. Twice-hourly plus the GitHub cron backup projects
# to ~39-98 of 100 depending on whether you scale the model or the measurement,
# a band wide enough that it is a number to re-measure rather than trust (see the
# README), and even its pessimistic end does not favour hourly. Second, once an
# hour is actively risky: a bulletin stamped H:30 appears on the feed anywhere
# from H+0:32 to H+1:04, so a single fixed poll can sit in the wrong half of that
# drift and miss one entirely.
#
# The second cron is Phase 2's daily alert at 01:30 UTC = 07:00 IST, dispatching
# send_alerts.yml instead of ingest.yml. src/index.js maps cron -> workflow by
# the exact string, so these two files have to agree character for character.
#
# It lives in this Worker rather than in the bot Worker because this one holds
# the GitHub PAT and has no public address; bot/ is internet-facing by
# definition, and a token that can start workflow runs does not belong behind a
# webhook anyone can POST to.
#
# The third is Phase 5's weekly monitor, Tuesday 02:00 UTC, dispatching
# monitor.yml. Tuesday and not Monday because it scores the week that just
# ended and pm25_history runs ~20h behind real time, so a Monday run would
# score a week whose last hours had not arrived. .github/workflows/monitor.yml
# carries the full reasoning.
crons = ["5,35 * * * *", "30 1 * * *", "0 2 * * 2"]
