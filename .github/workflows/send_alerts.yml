# The Phase 2 daily alert. One message per subscriber, once a day, 05:00 IST.
#
# Unlike ingest.yml, a missed run here is recoverable in principle — the reading
# still exists tomorrow — but it is not recoverable in practice: yesterday's air
# is not what anyone needs to know about, and a bot that skips two mornings in
# three is a bot people stop opening. Gate 2 is measured in retention.
name: send_alerts

on:
  # 23:30 UTC is 05:00 IST the following day. The hour is not arbitrary and not
  # remembered: CPCB's feed freezes every morning, so the last bulletin before
  # this is 05:00 IST and the next is between 10:00 and 13:00. Later in the
  # morning the reading only ages — at 09:00 it is 4.0h old and every message
  # would carry a staleness warning, every day, which teaches people to ignore
  # warnings. scripts/check_send_window.py re-measures the window on this same
  # schedule and fails when the send hour stops clearing the 3h rule.
  #
  # Moved 07:00 -> 05:00 on 2026-09-07. 07:00 is 2.0h old on 13 of 14 days and
  # was 5.0h on one (2026-08-26, when the freeze began at 02:00 IST instead of
  # 05:00); 05:00 is 0.0h on those same 13 days and 3.0h on the bad one
  # [measured 2026-09-07: bulletin ages per IST day over 14 days of
  # observations]. So the move is never worse and usually two hours fresher. It
  # costs no reader anything — a Telegram message waits in the chat, so someone
  # waking at 07:00 reads a 05:00 send at 07:00 either way.
  #
  # It does NOT make this robust: on 2026-08-26 05:00 sat at exactly the 3.0h
  # limit, so a worse morning fails here too. Do not raise the threshold when
  # that happens — read the per-day ages first and find out whether CPCB's
  # freeze has genuinely shifted or one outlier is failing a worst-case check.
  #
  # This is the BACKUP trigger, exactly as in ingest.yml. GitHub delivered 11 of
  # ~36 requested ticks over 18 hours on this repo, all 15-22 minutes late. The
  # primary is the Cloudflare Worker in trigger/, which fires a workflow_dispatch
  # at the same time and lands in 0 seconds. Both may fire: sent_log's
  # UNIQUE (chat_id, send_date) and the check above it make the second one a
  # no-op rather than a second message.
  #
  # Changing this cron means changing, together: SEND_HOUR in
  # scripts/check_send_window.py (IST), the matching string in
  # trigger/wrangler.toml and trigger/src/index.js (which must agree character
  # for character), classify.SEND_HOUR_IST and probe_cpcb_signal.SEND_HOUR_UTC
  # (both select the send hour's rows for re-measurement). This one is UTC.
  schedule:
    - cron: '30 23 * * *'

  workflow_dispatch:
    inputs:
      # Set only by trigger/'s fetch handler, i.e. a signup or a station change,
      # where a person is watching a spinner. It drops the two steps that do not
      # affect what that message says: requirements-model.txt (49s of a 78s run
      # [measured 2026-08-25: run 32877498644 step timings]) and the send-window
      # check, which is a daily question and not this message's.
      #
      # The cost is the forecast line, which forecast.outlook() refuses every
      # morning anyway. Once the October --stale 7 re-run clears and the line
      # starts rendering, a fast run omits it and the daily message does not.
      fast:
        description: "Skip model deps and the send-window check"
        type: boolean
        default: false

concurrency:
  group: send_alerts
  cancel-in-progress: false

# Same reasoning as ingest.yml: `contents: read` and not `{}`, because
# actions/checkout authenticates its clone with GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    # Shorter than ingest.yml's 15: there is no CPCB fetch here. Worst case is
    # connect() at 3 x 15s plus one Telegram call per subscriber at 3 x 30s.
    timeout-minutes: 10

    steps:
      # SHA-pinned for the reason ingest.yml gives: a major tag is a branch
      # GitHub can move, and a moved tag gets code execution in this job just
      # before TELEGRAM_BOT_TOKEN enters it. That token can read every
      # subscriber's messages and send as us.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version
          cache: pip

      # requirements-model.txt is installed HERE and nowhere else in the hot
      # path. ingest.yml runs every ~30 minutes and must stay at the single
      # runtime dependency requirements.txt pins; this job runs once a day, so
      # the ~300 MB of ML wheels cost one slow step a day rather than 48.
      #
      # It is what loads the promoted booster out of model_runs. Without it
      # send_alerts.warnings_by_station catches the ImportError and sends the
      # reading with no forecast line — degraded, not broken, and it says so on
      # stderr. Watch for "no forecast — model dependencies missing" in this
      # step's log; it means the install below silently stopped working.
      - name: Install frozen dependencies
        run: pip install -r requirements.txt

      - name: Install model dependencies
        if: ${{ !inputs.fast }}
        run: pip install -r requirements-model.txt

      # Same argument as ingest.yml's preflight: from outside the job, a missing
      # token and an unreachable database look identical, and the Actions log
      # download returns 403 without admin rights even on a public repo.
      # Presence, length and shape only — never a value.
      - name: Preflight — check secrets are present and well-formed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          status=0
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is empty. Add it under Settings -> Secrets and variables -> Actions -> Repository secrets."
            status=1
          else
            echo "DATABASE_URL: present (${#DATABASE_URL} chars)"
          fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN is empty. @BotFather issues it; the same value goes into the bot Worker as a Cloudflare secret."
            status=1
          else
            echo "TELEGRAM_BOT_TOKEN: present (${#TELEGRAM_BOT_TOKEN} chars)"
            # A bot token is '<numeric id>:<35-char secret>'. A truncated paste
            # or a copied placeholder fails this before a single message is
            # attempted, rather than as a 401 per subscriber.
            case "$TELEGRAM_BOT_TOKEN" in
              *:*) echo "  shape: ok" ;;
              *) echo "::error::TELEGRAM_BOT_TOKEN has no ':' — it is not a bot token."; status=1 ;;
            esac
          fi
          exit $status

      - name: Send
        env:
          PYTHONUNBUFFERED: "1"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/send_alerts.py

      # After the send, never before. This check failing means the send TIME is
      # wrong, not that today's message should be withheld — running it first
      # would turn a scheduling drift into a day of silence.
      #
      # `if: always()` so it still runs when the send failed: "did anyone get a
      # message" and "is the send hour still right" are independent questions.
      # The name carries no hour: it went stale the moment the send moved, and a
      # step whose label disagrees with what it checks is read as the truth.
      - name: Is the send hour still fresh?
        if: ${{ always() && !inputs.fast }}
        env:
          PYTHONUNBUFFERED: "1"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/check_send_window.py
