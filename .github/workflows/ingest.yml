# The Phase 1 ingester. The most important file in the repo: every bulletin it
# misses is training data that can never be recovered (build plan §4).
#
# Build plan §4 forbids running this inside a web dyno — a free web service
# sleeps after 15 minutes idle and its cron dies silently. GitHub Actions runs
# on GitHub's machines and has no such thing to sleep.
name: ingest

on:
  # Every 30 minutes, offset off the hour.
  #
  # WHY 30 MINUTES when CPCB publishes hourly: GitHub's scheduled runs are
  # best-effort. Under load they are delayed 15+ minutes and are occasionally
  # skipped outright. Running twice per hour means a delayed run still catches
  # the bulletin. The extra run costs nothing — observations is keyed on the
  # bulletin timestamp, so a repeat is an upsert that changes nothing.
  #
  # WHY :13 AND :43 rather than :05/:35, WHICH THIS USED TO BE. Measured over
  # the first 11h of deployment: GitHub delivered 8 of ~22 due ticks (36%),
  # 4-23 min late, with holes up to 3h32m. That is one run per hour, not two,
  # so the margin the 30-minute cadence exists to provide was already gone.
  # :05 and :35 are round-number slots and among the most contended; :13/:43
  # are not.
  #
  # THIS IS AN EXPERIMENT, NOT A FIX. Read the delivery ratio that
  # scripts/gate1_check.py now prints after ~24h:
  #   - two runs landing per hour  -> it was slot congestion, done.
  #   - still capped at ~1/hour    -> GitHub is throttling this workflow, and
  #     the cron is not the lever. Adding ticks would buy nothing; the answer
  #     is a redundant external trigger. Not built — see IDEAS.md.
  # Never once did two ticks land in the same hour, which is what points at
  # throttling rather than at independent random drops.
  #
  # Adding ticks was considered and rejected on evidence, not on cost: Neon
  # bills ~5 min of compute per wake, so 2/hour is ~30 of the 100 CU-hours and
  # even 4/hour would fit. The cliff is near 5-minute spacing, where the
  # database stops suspending at all.
  schedule:
    - cron: '13,43 * * * *'

  # So the job can be fired by hand from the Actions tab without waiting for a
  # tick. Used to prove the pipeline works before the 72-hour Gate 1 clock.
  workflow_dispatch:

# If a run overruns, do not let the next tick pile a second one on top.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned to match local. This machine has Python 3.13 as `python` and
          # 3.14 as `python3`; leaving the version unpinned here is how a cron
          # ends up on a different interpreter than anything ever tested.
          python-version: '3.13'
          cache: pip

      - name: Install frozen dependencies
        run: pip install -r requirements.txt

      # Fail fast, and say WHICH credential is wrong. Without this the job just
      # exits 1 from inside ingest.py with no fetch_log row written, and the two
      # possible causes (missing API key vs unreachable database) are
      # indistinguishable from the outside. A pipeline whose whole value is
      # uninterrupted uptime has to name its own failure.
      #
      # Values are never printed — only presence, length, and shape. GitHub
      # masks registered secrets in logs anyway, but this log is public, so the
      # code does not rely on that.
      - name: Preflight — check secrets are present and well-formed
        env:
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          status=0
          if [ -z "$DATA_GOV_IN_API_KEY" ]; then
            echo "::error::DATA_GOV_IN_API_KEY is empty. Add it under Settings -> Secrets and variables -> Actions -> Repository secrets (not Variables, not Environment)."
            status=1
          else
            echo "DATA_GOV_IN_API_KEY: present (${#DATA_GOV_IN_API_KEY} chars)"
          fi
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL is empty. Add it under Settings -> Secrets and variables -> Actions -> Repository secrets (not Variables, not Environment)."
            status=1
          else
            echo "DATABASE_URL: present (${#DATABASE_URL} chars)"
            case "$DATABASE_URL" in
              postgres://*|postgresql://*) echo "  scheme: ok" ;;
              *) echo "::error::DATABASE_URL does not start with postgres:// or postgresql:// — it was probably truncated or the wrong field was copied."; status=1 ;;
            esac
            case "$DATABASE_URL" in
              *sslmode=require*) echo "  sslmode=require: ok" ;;
              *) echo "::warning::DATABASE_URL has no sslmode=require — Neon may refuse the connection." ;;
            esac
          fi
          exit $status

      - name: Ingest
        env:
          # Entered by a human in Settings -> Secrets and variables -> Actions.
          # Never printed by the code: scripts/db.py redacts anything
          # password-shaped before it reaches this log, because Actions logs on
          # a public repo are public.
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/ingest.py

# Two GitHub behaviours designed around rather than discovered later:
#
#  1. GitHub DISABLES scheduled workflows on a repository with 60 days of no
#     commits. A dormant repo silently stops collecting. Push something, or
#     re-enable it from the Actions tab.
#
#  2. GitHub emails you when a run FAILS. It tells you nothing when a scheduled
#     run is SKIPPED. That blind spot is what the missing-hour query in
#     scripts/gate1_check.py exists to catch, and what Phase 5 monitoring is
#     for.
